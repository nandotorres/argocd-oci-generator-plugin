# Discover repositories across the registry namespace with wildcards and named
# captures, then create one Application per matching (repository, tag).
#
# Repository pattern: apps-oci/**/{env}
#   - "**" matches zero or more namespace segments (captured as oci.wildcards).
#   - "{env}" captures the final segment as oci.captures.env.
# Tag pattern: {app}-current
#   - captures the app name prefix as oci.captures.app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-oci-current
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - plugin:
        configMapRef:
          name: oci-generator
        requeueAfterSeconds: 300
        input:
          parameters:
            registry: artifactory.example.com
            repository: "apps-oci/**/{env}"
            tagPattern: "{app}-current"
            # Optional extra narrowing:
            # excludeTagFilters:
            #   - regex: ".*-rc.*"
            # sort: created
            # order: desc
            # limit: 50
  template:
    metadata:
      name: "{{ .oci.captures.app }}-{{ .oci.captures.env }}"
      labels:
        env: "{{ .oci.captures.env }}"
    spec:
      project: default
      source:
        repoURL: "{{ .oci.registry }}/{{ .oci.repository }}"
        targetRevision: "{{ .oci.tag }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .oci.captures.app }}-{{ .oci.captures.env }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
