# Helm charts pushed with ORAS. Same registry also has images and referrers;
# artifactType keeps those out. CI stamps vendor when the chart is releasable:
#
#   helm package ./orders
#   oras push registry.example.com/apps-oci/charts/orders:1.4.2 \
#     --artifact-type application/vnd.cncf.helm.config.v1+json \
#     --config config.json:application/vnd.cncf.helm.config.v1+json \
#     orders-1.4.2.tgz:application/vnd.cncf.helm.chart.content.v1.tar+gzip \
#     --annotation "org.opencontainers.image.vendor=payments"
#
# `helm push` writes the same config media type, so this filter works for both.
# One Application per app, newest non-prerelease tag.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: payments-charts
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - plugin:
        configMapRef:
          name: oci-generator
        requeueAfterSeconds: 300
        input:
          parameters:
            registry: registry.example.com
            repository: "apps-oci/charts/{app}"
            artifactType: application/vnd.cncf.helm.config.v1+json
            annotationSelectors:
              - key: org.opencontainers.image.vendor
                operator: In
                values: [payments]
            tagFilters:
              - semver: ">= 1.0.0"
            excludeTagFilters:
              - regex: ".*-rc.*"
            sort: semver
            order: desc
            limit: 1
            failOnEmpty: true
  template:
    metadata:
      name: "{{ .oci.captures.app }}"
      annotations:
        oci.digest: "{{ .oci.digest }}"
    spec:
      project: default
      source:
        repoURL: "{{ .oci.registry }}"
        chart: "{{ .oci.repository }}"
        targetRevision: "{{ .oci.tag }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .oci.captures.app }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
