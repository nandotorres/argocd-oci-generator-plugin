# Create an Application only if the artifact for this environment exists in ECR.
#
# The plugin authenticates to ECR via the server config (IRSA / Pod Identity /
# assumed role); the ApplicationSet carries NO credentials.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ecr-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - plugin:
        configMapRef:
          name: oci-generator
        requeueAfterSeconds: 300
        input:
          parameters:
            registry: "111122223333.dkr.ecr.us-east-1.amazonaws.com"
            repository: "apps-oci/my-app"
            tag: "production-current"
  template:
    metadata:
      name: "my-app-production"
      annotations:
        # The resolved digest, for auditing what a mutable tag pointed at.
        oci.digest: "{{ .oci.digest }}"
    spec:
      project: default
      source:
        repoURL: "oci://{{ .oci.registry }}/{{ .oci.repository }}"
        targetRevision: "{{ .oci.tag }}"
        path: generated
      destination:
        server: https://kubernetes.default.svc
        namespace: my-app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
