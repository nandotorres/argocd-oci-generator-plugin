# ServiceAccount used by the plugin Deployment, wired for IRSA.
#
# The plugin Deployment already sets `serviceAccountName: oci-generator`, so the
# pod assumes this role automatically via the projected web-identity token — no
# static AWS keys anywhere.
#
# For EKS Pod Identity instead of IRSA: omit the annotation below and create a
# pod identity association:
#   aws eks create-pod-identity-association --cluster-name <cluster> \
#     --namespace argocd --service-account oci-generator \
#     --role-arn arn:aws:iam::111122223333:role/oci-generator-irsa
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oci-generator
  namespace: argocd
  labels:
    app.kubernetes.io/name: oci-generator
    app.kubernetes.io/part-of: argocd
  annotations:
    # IRSA: the IAM role the pod assumes. Replace with your role ARN.
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/oci-generator-irsa
