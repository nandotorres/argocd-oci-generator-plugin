# Matrix generator: per-cluster fan-out (clusters generator) combined with the
# OCI plugin generator.
#
# The clusters generator yields one entry per selected cluster; its parameters
# (including the cluster name as .name) are interpolated into the plugin
# generator's input. Here each cluster has its own OCI artifact
# (apps-oci/web-app/<cluster>), so you publish one artifact per environment and
# this creates one Application per cluster from it.
#
# All names are placeholders (example.com, apps-oci/..., registry.example.com).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: web-app
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          # 1) Fan out over clusters selected by label.
          - clusters:
              selector:
                matchLabels:
                  example.com/auto-create-apps: "true"
          # 2) Does this cluster have an artifact published? The tag is
          #    interpolated with the cluster name from the clusters generator,
          #    so a cluster that has not been published to yields no result and
          #    simply gets no Application.
          #
          #    Keep the repository constant and put the per-cluster dimension in
          #    the tag: an absent tag in a repository that exists is a definitive
          #    "nothing here", whereas an absent repository is an error.
          - plugin:
              configMapRef:
                name: oci-generator
              requeueAfterSeconds: 600
              input:
                parameters:
                  registry: registry.example.com
                  repository: "apps-oci/web-app"
                  tag: "{{ .name }}-current"
  template:
    metadata:
      name: "web-app-{{ .name }}"
    spec:
      project: default
      destination:
        name: "{{ .name }}"
        namespace: web-app
      source:
        repoURL: "oci://{{ .oci.registry }}/{{ .oci.repository }}"
        targetRevision: "{{ .oci.tag }}"
        path: generated
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
