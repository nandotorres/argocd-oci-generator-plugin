# These Secrets are MERELY ILLUSTRATIVE — they show the shape and the key names
# the plugin expects. Do NOT commit real credentials here.
#
# In practice you will usually NOT create raw Secret objects at all. Prefer a
# secret-management workflow that produces these same Secrets for you, e.g.:
#   - External Secrets Operator (an ExternalSecret that syncs from AWS Secrets
#     Manager / Vault / GCP Secret Manager into 'oci-generator-secret' and
#     'oci-generator-registry-creds'),
#   - Sealed Secrets, or
#   - SOPS-encrypted manifests.
# Whatever you use, just make sure it creates Secrets with the names and keys
# below, since the Deployment and ConfigMaps reference them by those names.

# Shared bearer token between the ApplicationSet controller and the plugin.
# The key name "token" is referenced by configmap-plugin.yaml ("$oci-generator-secret:token").
apiVersion: v1
kind: Secret
metadata:
  name: oci-generator-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  token: "replace-with-a-long-random-token"
---
# Registry credentials consumed by the plugin server via env vars.
apiVersion: v1
kind: Secret
metadata:
  name: oci-generator-registry-creds
  namespace: argocd
  labels:
    app.kubernetes.io/name: oci-generator
type: Opaque
stringData:
  registry-user: "svc-argocd"
  registry-pass: "replace-with-registry-password-or-token"
