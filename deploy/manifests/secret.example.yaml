# EXAMPLE secrets. Do not commit real credentials; manage these with your secret
# tooling (Sealed Secrets, External Secrets, SOPS, ...).

# Shared bearer token between the ApplicationSet controller and the plugin.
# The key name "token" is referenced by configmap-plugin.yaml ("$oci-generator-secret:token").
apiVersion: v1
kind: Secret
metadata:
  name: oci-generator-secret
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  token: "replace-with-a-long-random-token"
---
# Registry credentials consumed by the plugin server via env vars.
apiVersion: v1
kind: Secret
metadata:
  name: oci-generator-registry-creds
  namespace: argocd
  labels:
    app.kubernetes.io/name: oci-generator
type: Opaque
stringData:
  artifactory-user: "svc-argocd"
  artifactory-pass: "replace-with-artifactory-password-or-token"
