# The plugin server's own configuration. No secrets live here — only ${VAR}
# indirections, resolved from the pod's environment at startup.
#
# How ${VAR} maps to a Secret (three hops, nothing inline):
#   Secret key  ->  Deployment env (secretKeyRef)  ->  ${VAR} in this file
# For example PLUGIN_TOKEN:
#   Secret oci-generator-secret[token]
#     -> deployment.yaml env PLUGIN_TOKEN (valueFrom.secretKeyRef)
#       -> config.yaml token: "${PLUGIN_TOKEN}"   (expanded at load; errors if unset)
# PLUGIN_TOKEN is the bearer token the ApplicationSet controller must present to
# call the plugin; the SAME Secret is referenced from the Argo CD side in
# configmap-plugin.yaml ("$oci-generator-secret:token") so both ends match.
# ARTIFACTORY_USER / ARTIFACTORY_PASS map the same way from
# oci-generator-registry-creds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-generator-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: oci-generator
    app.kubernetes.io/part-of: argocd
data:
  config.yaml: |
    listen: ":8080"
    token: "${PLUGIN_TOKEN}"
    defaultRegistry: artifactory.example.com
    requestTimeoutSeconds: 60
    registries:
      - host: artifactory.example.com
        auth:
          type: basic
          username: "${ARTIFACTORY_USER}"
          password: "${ARTIFACTORY_PASS}"
        allowedRepositories:
          - "apps-oci/**"
      - host: "111122223333.dkr.ecr.us-east-1.amazonaws.com"
        auth:
          type: ecr
          region: us-east-1
          roleArn: "arn:aws:iam::111122223333:role/argocd-ecr-reader"
    tls:
      insecureSkipVerify: false
      plainHTTP: false
