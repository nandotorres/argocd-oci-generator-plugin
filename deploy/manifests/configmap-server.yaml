# Plugin server config. No secrets here, only ${VAR} indirections expanded from
# the pod env at startup (unset variables are a startup error).
#
# Each ${VAR} is three hops from a Secret:
#   Secret key -> Deployment env (secretKeyRef) -> ${VAR} here
# e.g. oci-generator-secret[token] -> PLUGIN_TOKEN -> token: "${PLUGIN_TOKEN}".
# PLUGIN_TOKEN is the bearer token the ApplicationSet controller presents; the
# Argo CD side points at the same Secret in configmap-plugin.yaml
# ("$oci-generator-secret:token"), so both ends match.
# REGISTRY_USER / REGISTRY_PASS map the same way from
# oci-generator-registry-creds.
#
# For ECR, replace this file with deploy/examples/ecr/configmap-server-ecr.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oci-generator-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: oci-generator
    app.kubernetes.io/part-of: argocd
data:
  config.yaml: |
    listen: ":8080"
    token: "${PLUGIN_TOKEN}"
    defaultRegistry: registry.example.com
    requestTimeoutSeconds: 60
    registries:
      - host: registry.example.com
        auth:
          type: basic
          username: "${REGISTRY_USER}"
          password: "${REGISTRY_PASS}"
        allowedRepositories:
          - "apps-oci/**"
    tls:
      insecureSkipVerify: false
      plainHTTP: false
