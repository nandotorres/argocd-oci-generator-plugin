apiVersion: v1
kind: Service
metadata:
  name: oci-generator
  namespace: argocd
  labels:
    app.kubernetes.io/name: oci-generator
    app.kubernetes.io/part-of: argocd
spec:
  selector:
    app.kubernetes.io/name: oci-generator
  ports:
    - name: http
      port: 80
      targetPort: http
