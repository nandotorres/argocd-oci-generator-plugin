kind: ServiceAccount
metadata:
  name: oci-generator
  namespace: argocd
  labels:
    app.kubernetes.io/name: oci-generator
    app.kubernetes.io/part-of: argocd
  # For ECR via IRSA, annotate with the IAM role to assume:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/argocd-oci-generator
