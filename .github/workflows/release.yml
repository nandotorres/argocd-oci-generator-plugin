name: release

on:
  push:
    tags:
      - "v*"

# Least privilege at the top; the release job widens where strictly needed.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.3"
  GOFLAGS: "-mod=readonly"

jobs:
  # ---------------------------------------------------------------------------
  # Supply-chain gate: if deps/source carry known vulnerabilities, the release
  # job never runs, so a compromised dependency cannot produce a signed artifact.
  # ---------------------------------------------------------------------------
  guard:
    name: supply-chain gate
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck
        run: govulncheck ./...
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Trivy filesystem scan (fail on fixable CRITICAL/HIGH)
        env:
          # Comma-separated mirrors: Trivy falls through to the next on rate limits
          # (public.ecr.aws returns TOOMANYREQUESTS under load).
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --ignorefile .trivyignore.yaml \
            --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 .

  release:
    name: goreleaser + sign + attest
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
      id-token: write # Sigstore keyless signing + attestations (OIDC)
      attestations: write # actions/attest-* writes to the attestations store
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # syft provides the SBOMs GoReleaser attaches to the release/archives.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the authoritative multi-arch manifest-list digest straight from
      # the registry (robust against GoReleaser's internal artifact schema).
      - name: Resolve pushed image digest
        id: img
        run: |
          repo="ghcr.io/${{ github.repository }}"
          version="${GITHUB_REF_NAME#v}"
          digest="$(docker buildx imagetools inspect "$repo:$version" \
            --format '{{ json .Manifest.Digest }}' | tr -d '"')"
          case "$digest" in
            sha256:*) : ;;
            *) echo "::error::could not resolve image digest for $repo:$version"; exit 1 ;;
          esac
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image: $repo@$digest"

      # SLSA build provenance for the container image (verifiable via `gh attestation verify`).
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.repo }}
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true

      # Post-publish scan of the exact released digest.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
        run: |
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
      - name: Trivy image scan (SARIF)
        env:
          # Comma-separated mirrors: Trivy falls through to the next on rate limits
          # (public.ecr.aws returns TOOMANYREQUESTS under load).
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
        run: |
          trivy image --format sarif --output trivy-image.sarif \
            --ignore-unfixed --severity CRITICAL,HIGH \
            "${{ steps.img.outputs.repo }}@${{ steps.img.outputs.digest }}"

      - name: Upload image scan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
