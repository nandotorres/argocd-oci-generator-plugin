name: supply-chain-pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sc-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-commits:
    name: verify signed commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Uses GitHub's own verification status (the signing key must be
      # registered on the author's account), so it covers SSH *and* GPG.
      - name: Require every commit to be verified-signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
            range="$base..$head"
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
            # New branch / unknown base: just check the tip.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              range="$head -n1"
            else
              range="$base..$head"
            fi
          fi
          commits=$(git rev-list $range)
          [ -n "$commits" ] || { echo "No commits to verify."; exit 0; }
          fail=0
          for sha in $commits; do
            v=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.verified')
            reason=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.reason')
            if [ "$v" = "true" ]; then
              echo "ok       $sha"
            else
              echo "UNSIGNED $sha ($reason)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more commits are not verified-signed"; exit 1
          fi

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Review dependency changes
        uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1
        with:
          fail-on-severity: high
          # Block copyleft/unknown licenses from entering the dependency tree.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
