name: supply-chain-pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sc-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signed-commits:
    name: verify signed commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Uses GitHub's own verification status (the signing key must be
      # registered on the author's account), so it covers SSH *and* GPG.
      - name: Require every commit to be verified-signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
            range="$base..$head"
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
            # New branch / unknown base: just check the tip.
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              range="$head -n1"
            else
              range="$base..$head"
            fi
          fi
          commits=$(git rev-list $range)
          [ -n "$commits" ] || { echo "No commits to verify."; exit 0; }
          fail=0
          for sha in $commits; do
            v=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.verified')
            reason=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.verification.reason')
            if [ "$v" = "true" ]; then
              echo "ok       $sha"
            else
              echo "UNSIGNED $sha ($reason)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more commits are not verified-signed"; exit 1
          fi

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # the action only supports PR events
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Block copyleft/unknown licenses from entering the dependency tree.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          comment-summary-in-pr: on-failure

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pinned binary + filesystem scan: deterministic and independent of the
      # git-revision-range handling that breaks the gitleaks-action on pushes.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        run: gitleaks dir . --redact --no-banner --exit-code 1
