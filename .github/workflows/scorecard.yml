name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "19 5 * * 2" # weekly
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to the Security tab
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publishing to the public OpenSSF API rejects SHA-pinned action refs
          # ("imposter commit"); keep false since actions are pinned by policy.
          publish_results: false
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 7
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard

      # Human-readable scores (aggregate + per-check 0..10) rendered into the
      # run Summary page — the SARIF above only carries findings, not scores.
      - name: Run Scorecard (JSON)
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.json
          results_format: json
          publish_results: false
      - name: Render score table to job summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("scorecard.json"))
          print(f"## OpenSSF Scorecard: **{d.get('score','?')}/10**\n")
          print("| Score | Check | Reason |")
          print("|------:|-------|--------|")
          for c in sorted(d.get("checks", []), key=lambda x: (x.get("score") if x.get("score") is not None else -1)):
              s = c.get("score")
              s = s if s is not None else "n/a"
              reason = (c.get("reason") or "").replace("|", "\\|")[:80]
              print(f"| {s} | {c.get('name','')} | {reason} |")
          PY
