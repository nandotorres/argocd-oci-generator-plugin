version: 2

project_name: argocd-oci-generator-plugin

before:
  hooks:
    - go mod tidy

builds:
  - id: plugin
    main: ./cmd/plugin
    binary: plugin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

# Keyless (Sigstore) signature over the checksum file, which in turn covers
# every archive + SBOM. cosign v4 emits a single Sigstore bundle (certificate +
# signature + transparency-log entry). Verify with:
#   cosign verify-blob --bundle checksums.txt.cosign.bundle \
#     --certificate-identity-regexp 'https://github.com/<owner>/<repo>' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.cosign.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

dockers:
  - id: amd64
    image_templates:
      - "ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile.release   # runtime-only: copies the prebuilt binary
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
  - id: arm64
    image_templates:
      - "ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile.release
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}"
    image_templates:
      - "ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}-amd64"
      - "ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}-arm64"
  - name_template: "ghcr.io/nandotorres/argocd-oci-generator-plugin:latest"
    image_templates:
      - "ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}-amd64"
      - "ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}-arm64"

docker_signs:
  - cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "--yes"
      - "${artifact}@${digest}"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Security
      regexp: '^.*?(sec|security)(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  prerelease: auto
  footer: |
    ---
    ### Container image
    `ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }}`

    **Verify provenance (SLSA):**
    ```
    gh attestation verify oci://ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }} \
      --repo nandotorres/argocd-oci-generator-plugin
    ```
    **Verify image signature (cosign keyless):**
    ```
    cosign verify ghcr.io/nandotorres/argocd-oci-generator-plugin:{{ .Version }} \
      --certificate-identity-regexp 'https://github.com/nandotorres/argocd-oci-generator-plugin' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
    **Verify release archives (cosign keyless, Sigstore bundle):**
    ```
    cosign verify-blob --bundle checksums.txt.cosign.bundle \
      --certificate-identity-regexp 'https://github.com/nandotorres/argocd-oci-generator-plugin' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
    sha256sum --check --ignore-missing checksums.txt
    ```
