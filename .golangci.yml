# golangci-lint v2 configuration.
version: "2"

run:
  timeout: 5m

linters:
  # The default set already includes errcheck, govet, ineffassign, staticcheck
  # and unused; we add the extras below.
  enable:
    - bodyclose
    - misspell
    - nakedret
    - revive
    - unconvert
  settings:
    staticcheck:
      # Disable the opinionated "quickfix" refactor suggestions (QF*); keep the
      # real correctness/style checks.
      checks:
        - all
        - -QF1001
        - -QF1002
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - bodyclose

# In v2, formatters are their own category.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nandotorres/argocd-oci-generator-plugin

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
